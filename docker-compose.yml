services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: webchat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webchat"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    environment:
      PORT: 3000
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: webchat
      DB_USER: postgres
      DB_PASSWORD: password
      JWT_ALGORITHM: ES256
      JWT_EXPIRES_IN: 3600
      JWT_PRIVATE_KEY_PATH: /app/src/tests/jwt.keys/private-es256.pem
      JWT_PUBLIC_KEY_PATH: /app/src/tests/jwt.keys/public-es256.pem
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  pgdata:
